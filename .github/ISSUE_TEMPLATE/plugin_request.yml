name: Плагин
description: Предложить плагин (порт из Vencord или новый)
title: "plugin: "
labels: [plugin]
body:
  - type: input
    id: name
    attributes:
      label: Название
      placeholder: ClearURLs
    validations:
      required: true
  - type: input
    id: vencord
    attributes:
      label: Аналог в Vencord
      description: Ссылка на плагин Vencord, если это порт.
      placeholder: https://vencord.dev/plugins/ClearURLs
  - type: textarea
    id: what
    attributes:
      label: Что делает
      description: Поведение с точки зрения пользователя.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Слой
      description: "Сеть — если хватает REST и Gateway (предпочтительно). UI — если нужно рисовать в клиенте. См. ARCHITECTURE.md."
      options:
        - Сеть (REST / Gateway)
        - Тема (палитра, шрифты)
        - UI (хуки в клиенте)
        - Не знаю
    validations:
      required: true
  - type: textarea
    id: events
    attributes:
      label: Какие события нужны
      description: Маршруты REST, события Gateway или op'ы, которые плагин читает или меняет.
      placeholder: "POST /channels/{id}/messages — переписать content\nMESSAGE_CREATE — ..."
  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Плагина нет в таблице ROADMAP.md
          required: true
        - label: Плагин не для спама, самоботов, обхода банов или слежки за другими людьми
          required: true
        - label: Готов(а) написать плагин сам(а)
