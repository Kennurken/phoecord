name: Фича
description: Предложить возможность для ядра, прокси, загрузчика или инсталлера
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Новый плагин? Используйте шаблон «Плагин». Сначала загляните в [ROADMAP.md](https://github.com/nanda070/phoecord/blob/main/ROADMAP.md) — возможно, это уже в плане.
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает
      description: Что сейчас неудобно или невозможно.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предложение
      description: Как это должно работать. Если меняется Plugin API — какие типы и почему.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      multiple: true
      options:
        - core (Plugin API)
        - proxy
        - plugin-runtime / SDK
        - loader
        - installer
        - cli
        - документация
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Что ещё рассматривали.
  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Поискал похожие issue и пункт в ROADMAP.md
          required: true
